<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>すけるん工房</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#06c755">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f6f2;--fg:#222;--card:#fff;--ac:#06c755;--bd:#d8d8d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a1a;--fg:#eee;--card:#2a2a2a;--bd:#444}}
:root[data-theme="dark"]{--bg:#1a1a1a;--fg:#eee;--card:#2a2a2a;--bd:#444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Hiragino Sans",sans-serif;padding:12px}
h1{font-size:18px;margin:0 0 10px}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
button,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.main{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;margin-top:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ck{background-color:#fff;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.wrap{overflow:auto;max-height:60vh;border-radius:8px}
canvas{display:block;max-width:100%;touch-action:none}
input[type=range]{flex:1;min-width:100px}
#out img,#grid img{max-width:100%;border:1px solid var(--bd)}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
small{opacity:.7}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center;cursor:pointer}
.sc .ic{width:100%;aspect-ratio:1;object-fit:contain;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;opacity:.8}
.sc b{display:block;font-size:13px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc.add{border-style:dashed;color:var(--ac);font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px}.sc.add small{color:var(--ac);font-size:12px;opacity:1}
.cell{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:8px;aspect-ratio:37/32;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:contain}
.cell i{position:absolute;left:3px;top:3px;font-style:normal;font-size:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 5px}
.cell button{position:absolute;right:2px;top:2px;padding:0 6px;font-size:14px;line-height:20px;border-radius:50%}
input.nm{flex:1;min-width:0;font:inherit;font-size:17px;font-weight:600;background:transparent;color:var(--fg);border:0;border-bottom:1px solid var(--bd);padding:4px}
#pk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:9}
#pk .box{background:var(--card);padding:16px;border-radius:14px;width:min(90%,340px)}#pk select{width:100%;margin:10px 0}
body.mgr{background:#000;color:#eee;--bg:#000;--fg:#eee;--card:#1c1c1c;--bd:#333}
.cell button.dl{top:auto;bottom:2px;left:2px;right:auto;border-radius:8px;line-height:18px}
</style></head><body>
<h1>すけるん工房 <small>スタンプ制作</small></h1>
<div class="tabs"><button id="t1" class="on">背景透過</button><button id="t2">スタンプ管理</button></div>
<div id="tA">
<div class="card"><h2>① 1枚ずつ仕上げる</h2>
  <div class="row"><div style="width:100%">画像を選ぶ：<input id="file" type="file" accept="image/*"></div><div style="width:100%">カメラで撮る：<input id="cam" type="file" accept="image/*" capture="environment"></div><button id="undo">↩ 戻す</button></div>
  <div class="row"><button id="auto" class="main" style="margin:0">✨ 自動で背景を透過</button></div>
  <div class="row"><button id="mFill" class="on">色で透過</button><button id="mErase">消しゴム</button></div>
  <div class="row"><span>許容</span><input id="tol" type="range" min="0" max="100" value="20"><label><input id="glob" type="checkbox"> 同じ色を全部</label></div>
  <div class="row"><span>太さ</span><input id="bs" type="range" min="3" max="80" value="20"></div>
  <div class="wrap ck"><canvas id="cv" width="300" height="200"></canvas></div>
</div>
<div class="card"><h2>書き出し設定（①②共通）</h2>
  <div class="row"><span>サイズ</span><select id="sz"><option value="370x320">スタンプ 370×320</option><option value="240x240">メイン 240×240</option><option value="96x74">タブ 96×74</option><option value="192x192">アイコン 192×192</option><option value="512x512">アイコン 512×512</option><option value="custom">自由に入力</option><option value="0x0">余白カットのみ</option></select></div>
  <div class="row" id="cr" style="display:none"><span>幅</span><input id="cw" type="number" min="16" max="2000" value="512" style="width:80px"><span>×　高さ</span><input id="ch2" type="number" min="16" max="2000" value="512" style="width:80px"><span>px</span></div>
  <div class="row"><label><input id="bd" type="checkbox" checked> 白フチ</label><span>太さ</span><input id="bw" type="range" min="2" max="20" value="8"></div>
  <button id="exp" class="main">① の画像を書き出す</button>
  <div id="out" style="margin-top:8px"></div>
</div>
<div class="card"><h2>② まとめて処理（自動透過）</h2>
  <div class="row"><input id="multi" type="file" accept="image/*" multiple></div>
  <small>複数選ぶと、許容の値で自動透過→サイズ調整→白フチまで一気に行います。ファイル名順に stamp_01 から番号が付きます。</small>
  <div id="bmsg" style="margin:8px 0"></div><div id="grid"></div>
  <button id="zipb" class="main" style="display:none">ZIPでまとめて保存</button>
  <button id="addb" class="main" style="display:none">📁 スタンプ管理のセットに追加</button>
</div></div>
<div id="tB" style="display:none"><div id="mg"></div></div>
<div id="pk"></div>
<input type="file" id="fMain" accept="image/*" hidden><input type="file" id="fSt" accept="image/*" multiple hidden>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d',{willReadFrequently:true}),tol=$('tol');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
let mode='fill',undo=[],drawing=false,DL=null,B=[],lastOut=null;
(async()=>{try{DL=await claude.use('downloads')}catch(e){}})();
async function saveFile(name,blob){
  if(DL){try{await DL.save({filename:name,data:blob})}catch(e){}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function snap(){try{undo.push(cx.getImageData(0,0,cv.width,cv.height));if(undo.length>15)undo.shift()}catch(e){}}
$('undo').onclick=()=>{const s=undo.pop();if(s)cx.putImageData(s,0,0)};
$('mFill').onclick=()=>{mode='fill';$('mFill').className='on';$('mErase').className=''};
$('mErase').onclick=()=>{mode='erase';$('mErase').className='on';$('mFill').className=''};
function readImg(f){return new Promise((ok,ng)=>{const fr=new FileReader();fr.onerror=ng;fr.onload=()=>{const im=new Image();im.onload=()=>ok(im);im.onerror=ng;im.src=fr.result};fr.readAsDataURL(f)})}
function toCv(im){const k=Math.min(1,1200/Math.max(im.width,im.height)),c=mk(Math.round(im.width*k),Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c}
async function load(f){if(!f)return;try{const c=toCv(await readImg(f));cv.width=c.width;cv.height=c.height;cx.clearRect(0,0,c.width,c.height);cx.drawImage(c,0,0);undo=[]}catch(e){$('out').textContent='この画像は読み込めませんでした'}}
$('file').onchange=e=>{load(e.target.files[0]);e.target.value=''};
$('cam').onchange=e=>{load(e.target.files[0]);e.target.value=''};
addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it)load(it.getAsFile())});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();load(e.dataTransfer.files[0])});
function pos(e){const r=cv.getBoundingClientRect();return[Math.floor((e.clientX-r.left)*cv.width/r.width),Math.floor((e.clientY-r.top)*cv.height/r.height)]}
function fill(x,y){
  const w=cv.width,h=cv.height,im=cx.getImageData(0,0,w,h),d=im.data,i0=(y*w+x)*4;
  if(d[i0+3]===0)return;snap();
  const r=d[i0],g=d[i0+1],b=d[i0+2],t=tol.value*4.41,t2=t*t;
  const ok=i=>d[i+3]>0&&((d[i]-r)**2+(d[i+1]-g)**2+(d[i+2]-b)**2)<=t2;
  if($('glob').checked){for(let i=0;i<d.length;i+=4)if(ok(i))d[i+3]=0}
  else{const seen=new Uint8Array(w*h),st=[y*w+x];seen[y*w+x]=1;
    while(st.length){const p=st.pop(),px=p%w,py=(p-px)/w;d[p*4+3]=0;
      for(const[n,c]of[[p-1,px>0],[p+1,px<w-1],[p-w,py>0],[p+w,py<h-1]])if(c&&!seen[n]&&ok(n*4)){seen[n]=1;st.push(n)}}}
  cx.putImageData(im,0,0)}
function erase(x,y){cx.save();cx.globalCompositeOperation='destination-out';cx.beginPath();cx.arc(x,y,+$('bs').value/2,0,7);cx.fill();cx.restore()}
function autoKey(c,tv){
  const w=c.width,h=c.height,g=c.getContext('2d',{willReadFrequently:true}),im=g.getImageData(0,0,w,h),d=im.data;
  const cs=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([x,y])=>{const i=(y*w+x)*4;return[d[i],d[i+1],d[i+2],d[i+3]]}).filter(q=>q[3]>0);
  if(!cs.length)return;
  const t=tv*4.41,t2=t*t,seen=new Uint8Array(w*h),st=[];
  const ok=i=>{if(d[i+3]===0)return false;for(const q of cs)if((d[i]-q[0])**2+(d[i+1]-q[1])**2+(d[i+2]-q[2])**2<=t2)return true;return false};
  const add=p=>{if(!seen[p]&&ok(p*4)){seen[p]=1;st.push(p)}};
  for(let x=0;x<w;x++){add(x);add((h-1)*w+x)}
  for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}
  while(st.length){const p=st.pop(),px=p%w,py=(p-px)/w;d[p*4+3]=0;
    if(px>0)add(p-1);if(px<w-1)add(p+1);if(py>0)add(p-w);if(py<h-1)add(p+w)}
  g.putImageData(im,0,0)}
$('auto').onclick=()=>{snap();autoKey(cv,+tol.value)};
cv.onpointerdown=e=>{e.preventDefault();const[x,y]=pos(e);
  if(mode==='fill')fill(x,y);else{snap();drawing=true;cv.setPointerCapture(e.pointerId);erase(x,y)}};
cv.onpointermove=e=>{if(drawing){const[x,y]=pos(e);erase(x,y)}};
cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
function outline(im,b){
  const o=mk(im.width+2*b,im.height+2*b),c=o.getContext('2d'),s=mk(im.width,im.height),sc=s.getContext('2d');
  sc.drawImage(im,0,0);sc.globalCompositeOperation='source-in';sc.fillStyle='#fff';sc.fillRect(0,0,s.width,s.height);
  for(const r of[b,b*.7,b*.4])for(let a=0;a<360;a+=10)c.drawImage(s,b+Math.cos(a*Math.PI/180)*r,b+Math.sin(a*Math.PI/180)*r);
  c.drawImage(im,b,b);return o}
function makeOut(s){
  const w=s.width,h=s.height,d=s.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return null;
  const cw=x1-x0+1,ch=y1-y0+1,[W,H]=sizeVal(),b=$('bd').checked?+$('bw').value:0,m=W>100?10:4;
  const k=W?Math.min((W-2*m-2*b)/cw,(H-2*m-2*b)/ch):1,dw=Math.max(1,Math.round(cw*k)),dh=Math.max(1,Math.round(ch*k)),im=mk(dw,dh),c=im.getContext('2d');
  c.imageSmoothingQuality='high';c.drawImage(s,x0,y0,cw,ch,0,0,dw,dh);
  const f=b?outline(im,b):im,o=mk(W||f.width,H||f.height);
  o.getContext('2d').drawImage(f,Math.round((o.width-f.width)/2),Math.round((o.height-f.height)/2));return o}
function sizeVal(){const v=$('sz').value;if(v==='custom'){const f=id=>Math.min(2000,Math.max(16,+$(id).value||512));return[f('cw'),f('ch2')]}return v.split('x').map(Number)}
$('sz').onchange=()=>{$('cr').style.display=$('sz').value==='custom'?'flex':'none'};
const blobOf=c=>new Promise(r=>c.toBlob(r,'image/png'));
$('exp').onclick=async()=>{
  const o=makeOut(cv);if(!o){$('out').textContent='画像がありません';return}
  lastOut=await blobOf(o);
  $('out').innerHTML='<div class="ck" style="display:inline-block"><img src="'+o.toDataURL('image/png')+'"></div><div><small>長押し（PCは右クリック）でも保存できます。</small></div><button id="sv" class="main">この画像を保存</button>';
  $('sv').onclick=()=>saveFile('stamp.png',lastOut);
  $('out').insertAdjacentHTML('beforeend','<button id="ad" class="main">📁 スタンプ管理のセットに追加</button>');$('ad').onclick=()=>pick([o.toDataURL('image/png')])};
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=-1;for(const b of u)c=crcT[(c^b)&255]^(c>>>8);return(~c)>>>0};
function zip(fs){
  const E=new TextEncoder(),P=[],C=[];let o=0;
  for(const f of fs){const n=E.encode(f.name),c=crc(f.data),s=f.data.length;
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,c,true);h.setUint32(18,s,true);h.setUint32(22,s,true);h.setUint16(26,n.length,true);
    P.push(h,n,f.data);
    const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x0800,true);d.setUint32(16,c,true);d.setUint32(20,s,true);d.setUint32(24,s,true);d.setUint16(28,n.length,true);d.setUint32(42,o,true);
    C.push(d,n);o+=30+n.length+s}
  const cl=C.reduce((a,x)=>a+x.byteLength,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,fs.length,true);e.setUint16(10,fs.length,true);e.setUint32(12,cl,true);e.setUint32(16,o,true);
  return new Blob([...P,...C,e],{type:'application/zip'})}
$('multi').onchange=async e=>{
  const fs=[...e.target.files].sort((a,b)=>a.name.localeCompare(b.name,'ja',{numeric:true}));e.target.value='';
  B=[];$('grid').innerHTML='';$('zipb').style.display='none';$('addb').style.display='none';
  for(let i=0;i<fs.length;i++){
    $('bmsg').textContent='処理中… '+(i+1)+' / '+fs.length;
    try{const c=toCv(await readImg(fs[i]));autoKey(c,+tol.value);const o=makeOut(c);if(!o)continue;
      B.push({name:'stamp_'+String(B.length+1).padStart(2,'0')+'.png',blob:await blobOf(o),url:o.toDataURL('image/png')});
      $('grid').insertAdjacentHTML('beforeend','<div class="ck"><img src="'+o.toDataURL('image/png')+'"></div>')}catch(err){}
    await new Promise(r=>setTimeout(r,0))}
  $('bmsg').textContent=B.length+'枚できました（'+(fs.length-B.length)+'枚は失敗）';
  if(B.length){$('zipb').style.display='block';$('addb').style.display='block'}};
$('addb').onclick=()=>pick(B.map(b=>b.url));
$('zipb').onclick=async()=>{
  try{const files=[];for(const b of B)files.push({name:b.name,data:new Uint8Array(await b.blob.arrayBuffer())});
    await saveFile('stamps.zip',zip(files))}
  catch(err){$('bmsg').textContent='ZIP保存に失敗しました。画像を長押しして1枚ずつ保存してください。'}};

/* ---- スタンプ管理 ---- */
let S={sets:[]},cur=null,db=null;
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dbOpen=()=>new Promise(r=>{try{const q=indexedDB.open('stampmgr',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const dbLoad=()=>new Promise(r=>{if(!db)return r();try{const g=db.transaction('kv').objectStore('kv').get('s');g.onsuccess=()=>{if(g.result)S=g.result;r()};g.onerror=()=>r()}catch(e){r()}});
const sv=()=>{try{if(db)db.transaction('kv','readwrite').objectStore('kv').put(S,'s')}catch(e){}};
async function shrink(f,m){const im=await readImg(f),k=Math.min(1,m/Math.max(im.width,im.height)),c=mk(Math.round(im.width*k),Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/png')}
function tab(n){document.body.classList.toggle('mgr',n==2);$('tA').style.display=n==1?'':'none';$('tB').style.display=n==2?'':'none';$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':'';if(n==2)mhome()}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
function newSet(){const s={id:'s'+Date.now(),name:'新しいスタンプ',main:'',stamps:[]};S.sets.push(s);sv();return s}
function mhome(){cur=null;$('mg').innerHTML='<div class="sgrid">'+S.sets.map(s=>{const ic=s.main||s.stamps[0];return '<div class="sc" onclick="mopen(\''+s.id+'\')">'+(ic?'<img class="ic" src="'+ic+'">':'<div class="ic">画像なし</div>')+'<b>'+esc(s.name)+'</b><small>'+s.stamps.length+'個</small></div>'}).join('')+'<div class="sc add" onclick="mopen(newSet().id)">＋<small>新しいセット</small></div></div>'+(S.sets.length?'<small>アイコンをタップすると中身を一覧で見られます</small>':'<small>「背景透過」で作った画像を、セットに追加できます</small>')}
function mopen(id){cur=S.sets.find(s=>s.id===id);mdetail()}
function mdetail(){const s=cur;$('mg').innerHTML='<div class="row"><button onclick="mhome()">‹ 戻る</button><input class="nm" value="'+esc(s.name)+'" onchange="cur.name=this.value;sv()"></div>'
+'<div class="row">'+(s.main?'<img src="'+s.main+'" style="width:64px;height:64px;object-fit:contain;border-radius:8px;border:1px solid var(--bd)">':'')+'<button onclick="$(\'fMain\').click()">トップ画像を'+(s.main?'変更':'選ぶ')+'</button><button class="on" onclick="$(\'fSt\').click()">＋ スタンプを追加</button></div>'
+'<small>'+s.stamps.length+'個</small><div class="sgrid" style="margin-top:6px">'+s.stamps.map((d,i)=>'<div class="cell"><img src="'+d+'"><i>'+(i+1)+'</i><button onclick="mdel('+i+')">×</button><button class="dl" onclick="msave([cur.stamps['+i+']],cur.name)">⬇</button></div>').join('')+'</div>'
+'<div class="row">'+(s.stamps.length?'<button onclick="msave(cur.stamps,cur.name)">⬇ 全部保存</button>':'')+'<button onclick="mdelSet()" style="color:#d33">このセットを削除</button></div>'}
async function msave(urls,base){
 const fs=await Promise.all(urls.map(async(u,i)=>new File([await (await fetch(u)).blob()],base+'_'+String(i+1).padStart(2,'0')+'.png',{type:'image/png'})));
 if(navigator.canShare&&navigator.canShare({files:fs})){try{await navigator.share({files:fs});return}catch(e){if(e.name==='AbortError')return}}
 for(const f of fs)await saveFile(f.name,f)}
function mdel(i){if(confirm('このスタンプを削除しますか？')){cur.stamps.splice(i,1);sv();mdetail()}}
function mdelSet(){if(confirm('セットごと削除しますか？')){S.sets=S.sets.filter(s=>s!==cur);sv();mhome()}}
$('fMain').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;cur.main=await shrink(f,240);sv();mdetail()};
$('fSt').onchange=async e=>{const fs=[...e.target.files];e.target.value='';for(const f of fs)cur.stamps.push(await shrink(f,370));sv();mdetail()};
function pick(urls){$('pk').innerHTML='<div class="box"><b>どのセットに入れる？</b><select id="ps">'+S.sets.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'<option value="">＋ 新しいセット</option></select><div class="row"><button class="main" id="pok" style="margin:0;flex:1">追加する（'+urls.length+'枚）</button><button id="pno">やめる</button></div></div>';$('pk').style.display='flex';
$('pno').onclick=()=>$('pk').style.display='none';
$('pok').onclick=()=>{let s=S.sets.find(x=>x.id===$('ps').value)||newSet();s.stamps.push(...urls);sv();$('pk').style.display='none';tab(2);mopen(s.id)}}
dbOpen().then(dbLoad);
