<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5bd0">
<title>すけるん工房｜背景透過</title>
<style>
:root{--p:#6d5bd0;--ink:#282144;--bg:#f6f4ff;--line:#e1dcf5}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 16px;background:white;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0}header p{margin:5px 0 0;color:#6b6680;font-size:13px}
main{max-width:900px;margin:auto;padding:16px;display:grid;gap:14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:14px}
.controls,.row,.mode{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:11px;padding:11px 13px;font-weight:650;font-size:14px}.primary{background:var(--p);color:white;border-color:var(--p)}button:disabled{opacity:.45}.btn input{display:none}
.stage{min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;background-color:#fff;background-image:linear-gradient(45deg,#e7e7e7 25%,transparent 25%),linear-gradient(-45deg,#e7e7e7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e7e7e7 75%),linear-gradient(-45deg,transparent 75%,#e7e7e7 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0}
canvas{max-width:100%;max-height:58vh;touch-action:none}.empty{padding:48px 20px;text-align:center;color:#77718d}.status,.hint,.foot{font-size:12px;color:#77718d;line-height:1.7;margin-top:10px}.status{color:var(--p);min-height:20px}.selected{background:#eeeaff;border-color:#a89ce8}
</style></head>
<body>
<header><h1>✂️ すけるん工房</h1><p>背景を自動で消して、指で細かく修正できる画像編集ツール</p></header>
<main>
<section class="panel"><div class="controls"><label class="btn primary">画像を選ぶ<input id="file" type="file" accept="image/*"></label><button class="btn primary" id="auto" disabled>✨ 自動で背景を消す</button><button class="btn" id="save" disabled>透過PNGで保存</button></div><div class="status" id="status">まず画像を選んでね。</div></section>
<section class="panel"><div class="stage"><div class="empty" id="empty"><b>ここに画像が表示されます</b><br>写真やイラストを選んでね</div><canvas id="canvas" hidden></canvas></div>
<div class="row" style="margin-top:14px"><b style="font-size:13px">修正モード</b><div class="mode"><button class="btn selected" data-mode="erase">消す</button><button class="btn" data-mode="restore">元に戻す</button></div><label>筆の太さ <b id="sizeText">24</b> px</label><input id="size" type="range" min="4" max="100" value="24"><button class="btn" id="undo" disabled>↶ 1回戻す</button><button class="btn" id="reset" disabled>最初の状態</button></div><p class="hint">自動削除後、画像の上を指やマウスでなぞって修正できます。「消す」は透明に、「元に戻す」は元画像を復元します。</p></section>
<div class="foot">試作版です。初回はAIモデルのダウンロードに時間がかかる場合があります。画像処理は基本的にブラウザ内で行います。</div>
</main>
<script type="module">
const $=id=>document.getElementById(id),file=$('file'),canvas=$('canvas'),ctx=canvas.getContext('2d'),status=$('status'),empty=$('empty');
let original=null,originalCanvas=null,mode='erase',drawing=false,last=null,history=[];
const brush=()=>Number($('size').value),say=t=>status.textContent=t;
function snapshot(){try{history.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(history.length>12)history.shift();$('undo').disabled=false}catch(e){}}
function drawOriginal(){if(originalCanvas)ctx.drawImage(originalCanvas,0,0)}
file.addEventListener('change',()=>{const f=file.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){say('画像ファイルを選んでね。');return}const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{original=img;canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;originalCanvas=document.createElement('canvas');originalCanvas.width=canvas.width;originalCanvas.height=canvas.height;originalCanvas.getContext('2d').drawImage(img,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);drawOriginal();canvas.hidden=false;empty.hidden=true;history=[];$('auto').disabled=false;$('save').disabled=false;$('undo').disabled=true;$('reset').disabled=false;say(`画像を読み込みました（${canvas.width} × ${canvas.height} px）。自動削除を押してね。`);URL.revokeObjectURL(url)};img.onerror=()=>say('画像を読み込めませんでした。別の画像を試してね。');img.src=url});
$('auto').addEventListener('click',async()=>{if(!original)return;const btn=$('auto');btn.disabled=true;say('AIモデルを準備しています。初回は少し時間がかかるよ…');try{const {removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');say('背景を自動で削除中…');const blob=await removeBackground(original,{publicPath:'https://staticimgly.com/@imgly/background-removal-data/1.5.5/dist/'});const u=URL.createObjectURL(blob),cut=new Image();cut.onload=()=>{snapshot();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(cut,0,0,canvas.width,canvas.height);URL.revokeObjectURL(u);say('できたよ！画像をなぞって細かく修正してね。');btn.disabled=false};cut.onerror=()=>{say('処理結果を読み込めませんでした。もう一度試してね。');btn.disabled=false};cut.src=u}catch(e){console.error('すけるん工房 自動削除エラー:',e);const detail=e?.message||String(e);say('自動削除エラー：'+detail.slice(0,180)+'（画面を更新して再試行してね）');btn.disabled=false}});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===b))}));
$('size').addEventListener('input',()=>$('sizeText').textContent=brush());
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)}}
function stroke(a,b){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=brush()*(canvas.width/canvas.getBoundingClientRect().width);if(mode==='erase'){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='rgba(0,0,0,1)';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}else{ctx.globalCompositeOperation='source-over';ctx.drawImage(originalCanvas,0,0);ctx.globalCompositeOperation='destination-in';ctx.beginPath();ctx.arc(b.x,b.y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill()}ctx.restore()}
canvas.addEventListener('pointerdown',e=>{if(!original)return;drawing=true;canvas.setPointerCapture(e.pointerId);snapshot();last=point(e);stroke(last,last)});
canvas.addEventListener('pointermove',e=>{if(!drawing||!last)return;const p=point(e);stroke(last,p);last=p});function end(){drawing=false;last=null}
$('undo').addEventListener('click',()=>{const s=history.pop();if(s)ctx.putImageData(s,0,0);$('undo').disabled=!history.length;say('ひとつ前の状態に戻したよ。')});
$('reset').addEventListener('click',()=>{if(!originalCanvas)return;snapshot();ctx.clearRect(0,0,canvas.width,canvas.height);drawOriginal();say('元の画像に戻したよ。')});
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('pointerleave',()=>{if(drawing)end()});
$('save').addEventListener('click',()=>{if(!canvas.width)return;canvas.toBlob(blob=>{if(!blob){say('PNG保存に失敗しました。');return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sukerun-transparent.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);say('透過PNGを保存したよ！')},'image/png')});
</script></body></html>
